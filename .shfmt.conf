# Use 2-space indentation
-i 2

# Indent switch/case blocks
-ci

# Place binary operators (&&, ||, |) at the start of new lines
-bn

# Space redirect operators (e.g. `> file`)
-sr

# Simplify code where safe (removes redundant syntax)
-s

# Exclude directories (optional, adjust as needed)
-exclude vendor/
-exclude .git/
-exclude node_modules/
